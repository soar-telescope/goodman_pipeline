[tox]
env_list =
    py{310, 311, 312, 313, 314}-test{,-cov, -html}
minversion = 4.4.12

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg

extras = test

commands =
    pytest {tty:--color=yes} {posargs}
    cov,html: pytest {tty:--color=yes} --cov goodman_pipeline {posargs}
    cov: coverage xml -o '{toxinidir}/coverage.xml'
    html: coverage html -d .coverage_html
